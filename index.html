<script>
try{ loadfire() }catch( err ){ alert( "no loadfire()") }

var De = true
var bug = (window.console && console.log
  && function bug( m ){ console.log( "index.html: " + m)})
|| (De = false)

var Sw = {}
var Session = {config: {lang: "en"}}

Sw.i18n = {
  en: {
    "version msg":
    "Alpha " + sw_version + " version, please use for tests only"
  },
  fr: {
    "go to ": "revenir vers ",
    " or...": " ou bien...",
    "version msg":
    "Alpha " + sw_version + ", pour tests seulement, merci"
  }
}

Session.i18n = function( msg ){
  var lang = this.config.lang
  De&&bug( "lang: " + lang)
  if( !Sw.i18n[lang] ){
    Sw.i18n[lang] = {}
  }
  return Sw.i18n[lang][msg]
  || Sw.i18n["en"][msg]
  || msg
}

function clearDefault( el ){
  if( el.defaultValue == el.value ){
    el.value = ""
  }
}
</script>

<script>
$(document).ready( function(){
  var lang = "en"
  lang = navigator.language ? navigator.language : navigator.userLanguage
  lang = lang.substr( 0, 2)
  if( lang ){
    Session.config.lang = lang
    De&&bug( "lang: " + lang)
    $(".i18n").each( function( _, elem){
      var id = this.id
      De&&bug( "i18n: " + id)
      if( id.substr( 0, 3) != lang ){ return }
      var content = $("#" + id).html()
      $("#" + id.substr( 3)).html( content)
    })
  }
  if( sw_invite_mode ){
    var msg = Session.i18n( "version msg")
    $("#version").empty().append(
      "<h5>" + msg + "</h5>"
    )
  }
})
</script>
