<!DOCTYPE html>

    body {

      line-height: 1.4;
      margin: 0;
      padding: 0;
    }
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      opacity: 0.1;
      z-index: -1;
    }
    .sw_header {

      background: rgba(255,255,255,0.9);
      border-bottom: 2px solid #1e90ff;
    }
    .sw_header_content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sw_logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .sw_logo img {
      width: 64px;
      height: 64px;
    }
    #slogan strong {
      font-size: 24px;
      color: #1e90ff;
    }
    #slogan em {
      color: #1e90ff;
    }
    #tagline {
      text-align: center;
    }
    #tagline h1 {
      font-size: 18px;
      margin: 10px 0;
    }
    #tagline a {
      color: #1e90ff;
      text-decoration: none;
    }
    .sw_boxed {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(255,255,255,0.95);
      border: 2px solid #1e90ff;
      border-radius: 8px;
    }
    .sw_code {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border: 1px solid #ddd;
    }
    form {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    input[type="text"] {
      padding: 10px 15px;
      font-size: 16px;
      font-family: inherit;
      border: 2px solid #1e90ff;
      border-radius: 4px;
      width: 200px;
    }
    input[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      font-family: inherit;
      font-weight: bold;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background: #0c7cd5;
    }
    .sw_footer {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    .sw_footer a {
      color: #1e90ff;
      text-decoration: none;
      margin: 0 15px;
    }
    .sw_footer a:hover {
      text-decoration: underline;
    }
    #version {
      text-align: center;
      margin: 20px 0;
    }
    #version h5 {
      color: #666;
      font-size: 14px;
    }
    .i18n {
      display: none;
    }
    #login-buttons {
      text-align: right;
      padding: 10px;
    }
    #login-buttons a {
      color: #1e90ff;
      text-decoration: none;
    }
  </style>
</head>

<script>
function clearDefault( el ){
  if( el.defaultValue == el.value ){
    el.value = ""
  }
}

document.addEventListener( 'DOMContentLoaded', function(){
  var lang = "en"
  // Try our best to determine lang, fr or eng only
  lang = navigator.language ? navigator.language : navigator.userLanguage
  lang = lang.substr( 0, 2)
  if( lang && (lang == "en" || lang == "fr") ){
    // Patch localized elements
    document.querySelectorAll(".i18n").forEach( function( elem){
      var id = elem.id
      if( id.substr( 0, 3) != "fr_") return
      var content = elem.innerHTML
      var targetId = id.substr( 3)
      var target = document.getElementById( targetId)
      if( target ) target.innerHTML = content
    })
    if( lang == "fr" ) {
      document.querySelector("#version h5").textContent = "Alpha"
    }
  }
})
</script>
